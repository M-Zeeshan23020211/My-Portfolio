<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Scientist Portfolio</title>
<meta name="description" content="Data scientist portfolio — projects, skills, and services.">


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>


:root{
  --bg: #0b0e1f;
  --bg-panel: #151a35;
  --bg-panel-2: #10142a;
  --paper: #e9e4d8;
  --paper-dim: #d8d2c2;
  --amber: #fb7185;
  --amber-rgb: 251,113,133;
  --teal: #22d3ee;
  --teal-rgb: 34,211,238;
  --violet: #a78bfa;
  --text: #eef1fb;
  --text-dim: #97a0bd;
  --line: rgba(238,241,251,0.12);
  --line-strong: rgba(238,241,251,0.22);
  --radius: 10px;
  --font-display: 'Space Grotesk', sans-serif;
  --font-body: 'Inter', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --maxw: 1120px;
}

*{ box-sizing: border-box; }
html{ scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce){
  html{ scroll-behavior: auto; }
  *{ animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}

body{
  margin:0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

a{ color: inherit; text-decoration: none; }
img{ max-width: 100%; display:block; }
ul{ margin:0; padding:0; list-style:none; }
h1,h2,h3{ font-family: var(--font-display); margin:0; }
p{ margin:0; }
button{ font-family: inherit; }

::selection{ background: var(--amber); color: #0d1321; }

/* focus visibility */
a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible{
  outline: 2px solid var(--teal);
  outline-offset: 3px;
}


#bg-canvas{
  position: fixed; inset:0; width:100%; height:100%;
  z-index: 0; opacity: 0.55; pointer-events:none;
}


#scroll-progress{
  position: fixed; top:0; left:0; height:3px; width:0%;
  background: linear-gradient(90deg, var(--teal), var(--violet), var(--amber));
  z-index: 70; transition: width .1s ease-out;
}

/* shared entrance animation for grid children (chips, cards, skill groups) */
@keyframes fadeUp{
  from{ opacity:0; transform: translateY(18px); }
  to{ opacity:1; transform: translateY(0); }
}
.chip, .project-card, .skill-group{
  opacity:0;
  animation: fadeUp .6s ease forwards;
  animation-play-state: paused;
}
.cell.visible .chip,
.cell.visible .project-card,
.cell.visible .skill-group{
  animation-play-state: running;
}

@keyframes gradientMove{ to{ background-position: -200% center; } }
@keyframes pulseGlow{
  0%, 100%{ box-shadow: 0 0 0 8px rgba(var(--teal-rgb),0.06); }
  50%{ box-shadow: 0 0 0 16px rgba(var(--teal-rgb),0.14); }
}

/* =====================================================================
   NAV
   ===================================================================== */
#navbar{
  position: sticky; top:0; z-index: 50;
  display:flex; align-items:center; justify-content:space-between;
  padding: 16px clamp(20px, 5vw, 56px);
  background: rgba(13,19,33,0.72);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.logo{
  font-family: var(--font-mono); font-weight:700; font-size: 1.05rem;
  color: var(--text);
  display:flex; align-items:center; gap:8px;
}
.logo .dot{ color: var(--amber); }
.nav-links{ display:flex; gap: 28px; align-items:center; }
.nav-links a{
  font-family: var(--font-mono); font-size: 0.85rem; color: var(--text-dim);
  position:relative; padding: 4px 2px; transition: color .2s ease;
}
.nav-links a:hover, .nav-links a.active{ color: var(--teal); }
.nav-links a.active::after{
  content:''; position:absolute; left:0; right:0; bottom:-6px; height:2px; background: var(--teal);
}
.nav-cta{
  font-family: var(--font-mono); font-size: 0.8rem;
  border: 1px solid var(--line-strong); padding: 8px 14px; border-radius: 6px;
  transition: all .2s ease;
}
.nav-cta:hover{ border-color: var(--amber); color: var(--amber); }
.nav-right{ display:flex; align-items:center; gap:22px; }

#hamburger{
  display:none; flex-direction:column; gap:5px; background:none; border:none; cursor:pointer; padding:6px;
}
#hamburger span{ width:22px; height:2px; background: var(--text); transition: all .25s ease; }

.mobile-menu{
  position: fixed; inset: 0 0 0 auto; width: min(78vw, 320px); height:100vh;
  background: var(--bg-panel); border-left: 1px solid var(--line);
  transform: translateX(100%); transition: transform .3s ease;
  z-index: 60; padding: 90px 28px; display:flex; flex-direction:column; gap:26px;
}
.mobile-menu.open{ transform: translateX(0); }
.mobile-menu a{ font-family: var(--font-mono); font-size: 1.05rem; color: var(--text); }
#overlay{
  position:fixed; inset:0; background: rgba(0,0,0,0.5); opacity:0; pointer-events:none;
  transition: opacity .3s ease; z-index: 55;
}
#overlay.open{ opacity:1; pointer-events:auto; }

/* =====================================================================
   LAYOUT / CELL STRUCTURE (notebook motif)
   ===================================================================== */
main{ position: relative; z-index: 1; }

.cell{
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 90px clamp(20px, 5vw, 56px) 20px;
  opacity: 0;
  transform: translateY(24px);
  transition: opacity .7s ease, transform .7s ease;
}
.cell.visible{ opacity:1; transform: translateY(0); }

.cell-head{
  font-family: var(--font-mono); font-size: 0.82rem; color: var(--amber);
  margin-bottom: 28px; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
}
.cell-head .cell-comment{ color: var(--text-dim); }
.cell-head .rule{ flex:1; height:1px; background: var(--line); min-width: 40px; }

.cell-out{
  font-family: var(--font-mono); font-size: 0.78rem; color: var(--text-dim);
  margin-top: 34px; padding-top: 14px; border-top: 1px dashed var(--line);
}

.section-title{
  font-size: clamp(1.5rem, 3vw, 2.1rem);
  font-weight: 600; margin-bottom: 10px; letter-spacing: -0.01em;
}
.section-sub{ color: var(--text-dim); max-width: 60ch; margin-bottom: 36px; }

/* =====================================================================
   HERO
   ===================================================================== */
#hero{ padding-top: 60px; }
.hero-grid{
  display:grid; grid-template-columns: 220px 1fr; gap: 56px; align-items:center;
}
.hero-photo{
  width: 220px; height: 220px; border-radius: 50%;
  border: 2px solid var(--line-strong);
  overflow:hidden; position:relative;
  animation: pulseGlow 3.2s ease-in-out infinite;
}
.hero-photo img{ width:100%; height:100%; object-fit:cover; }
.hero-photo .initials{
  width:100%; height:100%; display:flex; align-items:center; justify-content:center;
  font-family: var(--font-display); font-size: 3.4rem; font-weight:700;
  background: linear-gradient(145deg, var(--bg-panel), var(--bg-panel-2));
  color: var(--teal);
}
.eyebrow{
  font-family: var(--font-mono); color: var(--teal); font-size: 0.85rem;
  margin-bottom: 10px; letter-spacing: 0.02em;
}
.hero-text h1{
  font-size: clamp(2.2rem, 5vw, 3.6rem);
  line-height: 1.05; margin-bottom: 14px;
  background: linear-gradient(90deg, var(--teal), var(--violet), var(--amber), var(--teal));
  background-size: 250% auto;
  -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: gradientMove 7s linear infinite;
}
.role-line{
  font-family: var(--font-mono); font-size: clamp(1rem, 2vw, 1.2rem);
  color: var(--text); margin-bottom: 18px; min-height: 1.4em;
}
.role-line .prompt{ color: var(--amber); }
.role-line .typed{ color: var(--teal); }
.cursor{
  display:inline-block; color: var(--amber); animation: blink 1s steps(1) infinite;
}
@keyframes blink{ 50%{ opacity:0; } }

.tagline{ color: var(--text-dim); max-width: 56ch; margin-bottom: 30px; font-size: 1.02rem; }

.hero-cta{ display:flex; gap:16px; flex-wrap:wrap; margin-bottom: 30px; }
.btn{
  font-family: var(--font-mono); font-size: 0.88rem; padding: 12px 22px; border-radius: 6px;
  border: 1px solid transparent; transition: transform .2s ease, box-shadow .2s ease, background .2s ease, color .2s ease;
  display:inline-flex; align-items:center; gap:8px;
}
.btn-primary{
  background: linear-gradient(90deg, var(--amber), var(--violet));
  background-size: 200% auto; background-position: 0% center;
  color: #0b0e1f; font-weight:600;
}
.btn-primary:hover{
  transform: translateY(-2px); background-position: 100% center;
  box-shadow: 0 10px 24px rgba(var(--amber-rgb),0.25);
}
.btn-ghost{ border-color: var(--line-strong); color: var(--text); }
.btn-ghost:hover{ border-color: var(--teal); color: var(--teal); transform: translateY(-2px); }

.hero-socials{ display:flex; gap:14px; }
.social-btn{
  width:38px; height:38px; border-radius:50%; border:1px solid var(--line-strong);
  display:flex; align-items:center; justify-content:center;
  transition: all .2s ease; color: var(--text-dim);
}
.social-btn svg{ width:17px; height:17px; }
.social-btn:hover{ border-color: var(--teal); color: var(--teal); transform: translateY(-3px); }

/* =====================================================================
   SKILLS
   ===================================================================== */
.skills-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 22px; }
.skill-group{
  background: var(--bg-panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 22px;
}
.skill-group h3{
  font-family: var(--font-mono); font-size: 0.95rem; color: var(--teal); margin-bottom: 16px;
}
.chip-row{ display:flex; flex-wrap:wrap; gap: 8px; }
.chip{
  font-family: var(--font-mono); font-size: 0.78rem; padding: 6px 12px;
  border-radius: 20px; border: 1px solid var(--line-strong); color: var(--text-dim);
  transition: all .2s ease;
}
.chip:hover{ border-color: var(--amber); color: var(--amber); transform: translateY(-2px); }

/* =====================================================================
   PROJECTS
   ===================================================================== */
.projects-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; }
.project-card{
  background: var(--bg-panel); border: 1px solid var(--line); border-radius: var(--radius);
  overflow:hidden; display:flex; flex-direction:column; transition: transform .25s ease, border-color .25s ease;
}
.project-card:hover{ transform: translateY(-6px); border-color: var(--amber); }
.project-thumb{
  height: 150px; background: linear-gradient(135deg, var(--bg-panel-2), var(--bg-panel));
  position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center;
  font-family: var(--font-mono); color: var(--text-dim); font-size: 0.75rem;
}
.project-thumb canvas{ position:absolute; inset:0; width:100%; height:100%; }
.project-body{ padding: 20px; display:flex; flex-direction:column; gap: 12px; flex:1; }
.project-body h3{ font-size: 1.08rem; }
.project-body p{ color: var(--text-dim); font-size: 0.9rem; flex:1; }
.tag-row{ display:flex; flex-wrap:wrap; gap:6px; }
.tag{
  font-family: var(--font-mono); font-size: 0.7rem; padding: 3px 9px; border-radius: 4px;
  background: rgba(242,183,5,0.1); color: var(--amber);
}
.project-links{ display:flex; gap: 14px; margin-top: 4px; }
.project-links a{
  font-family: var(--font-mono); font-size: 0.78rem; color: var(--text-dim);
  display:flex; align-items:center; gap:5px; transition: color .2s ease;
}
.project-links a:hover{ color: var(--teal); }
.project-links svg{ width:14px; height:14px; }

/* =====================================================================
   CONTACT
   ===================================================================== */
/* =====================================================================
   FOOTER
   ===================================================================== */
footer{
  border-top: 1px solid var(--line); margin-top: 60px; padding: 30px clamp(20px,5vw,56px);
  display:flex; flex-direction:row; justify-content:space-between; align-items:center; flex-wrap:wrap; gap: 12px;
  font-family: var(--font-mono); font-size: 0.78rem; color: var(--text-dim);
  position: relative; z-index:1; max-width: var(--maxw); margin-left:auto; margin-right:auto;
}
footer a:hover{ color: var(--teal); }
#footerSocials{ display:flex; flex-direction:row; align-items:center; gap:12px; }
#footerSocials .social-btn{ width:32px; height:32px; }
#footerSocials .social-btn svg{ width:15px; height:15px; }

/* =====================================================================
   RESPONSIVE
   ===================================================================== */
@media (max-width: 860px){
  .hero-grid{ grid-template-columns: 1fr; text-align:center; }
  .hero-photo{ margin: 0 auto; width: 170px; height:170px; }
  .hero-cta{ justify-content:center; }
  .hero-socials{ justify-content:center; }
  .nav-links{ display:none; }
  #hamburger{ display:flex; }
  .nav-cta{ display:none; }
}
@media (max-width: 480px){
  .cell{ padding-top: 64px; }
}
</style>

function badgeIcon(letters){ return '<span style="font-family:var(--font-mono);font-size:0.68rem;font-weight:700;">'+letters+'</span>'; }
function getIcon(name){
  if(name === 'kaggle') return badgeIcon('Ka');
  if(name === 'twitter') return badgeIcon('X');
  return ICONS[name] || badgeIcon('&bull;');
}

/* =====================================================================
   3. RENDER — turns CONFIG into DOM. You shouldn't need to edit below.
   ===================================================================== */
document.title = CONFIG.name + " — " + CONFIG.role;

// Hero
document.getElementById('heroName').textContent = CONFIG.name;
document.getElementById('heroTagline').textContent = CONFIG.tagline;
document.getElementById('heroLocation').textContent = CONFIG.location;
document.getElementById('resumeLink').href = CONFIG.resumeUrl;

const photoWrap = document.getElementById('heroPhotoWrap');
if(CONFIG.photo){
  const img = document.createElement('img');
  img.src = CONFIG.photo;
  img.alt = CONFIG.name;
  photoWrap.appendChild(img);
} else {
  const initials = CONFIG.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
  photoWrap.innerHTML = '<div class="initials">'+initials+'</div>';
}

function renderSocials(container, small){
  container.innerHTML = '';
  CONFIG.socials.forEach(s=>{
    const a = document.createElement('a');
    a.href = s.url; a.target = '_blank'; a.rel = 'noopener';
    a.className = 'social-btn'; a.title = s.name; a.setAttribute('aria-label', s.name);
    a.innerHTML = getIcon(s.icon);
    container.appendChild(a);
  });
}
renderSocials(document.getElementById('heroSocials'));

// Skills
const skillsGrid = document.getElementById('skillsGrid');
Object.entries(CONFIG.skills).forEach(([group, items], gIdx)=>{
  const div = document.createElement('div');
  div.className = 'skill-group';
  div.style.animationDelay = (gIdx * 80) + 'ms';
  div.innerHTML = '<h3>'+group+'</h3><div class="chip-row">'+items.map((i,cIdx)=>'<span class="chip" style="animation-delay:'+(gIdx*80 + cIdx*40)+'ms">'+i+'</span>').join('')+'</div>';
  skillsGrid.appendChild(div);
});

// Projects
const projectsGrid = document.getElementById('projectsGrid');
CONFIG.projects.forEach((p, idx)=>{
  const card = document.createElement('div');
  card.className = 'project-card';
  card.style.animationDelay = (idx * 90) + 'ms';
  let links = '';
  if(p.github) links += '<a href="'+p.github+'" target="_blank" rel="noopener">'+ICONS.github+' Code</a>';
  if(p.demo) links += '<a href="'+p.demo+'" target="_blank" rel="noopener">'+ICONS.external+' Demo</a>';
  if(p.kaggle) links += '<a href="'+p.kaggle+'" target="_blank" rel="noopener">'+badgeIcon('Ka')+' Kaggle</a>';
  card.innerHTML =
    '<div class="project-thumb" data-idx="'+idx+'"><canvas></canvas><span style="position:relative;z-index:1">Out['+(idx+1)+']</span></div>'+
    '<div class="project-body">'+
      '<h3>'+p.title+'</h3>'+
      '<p>'+p.desc+'</p>'+
      '<div class="tag-row">'+p.tags.map(t=>'<span class="tag">'+t+'</span>').join('')+'</div>'+
      '<div class="project-links">'+links+'</div>'+
    '</div>';
  projectsGrid.appendChild(card);
});
document.getElementById('moreProjectsLink').href = CONFIG.githubProfile;

// Nav CTA -> straight to email
document.getElementById('navCta').href = 'mailto:' + CONFIG.email;

// Footer
document.getElementById('footerName').textContent = '© ' + new Date().getFullYear() + ' ' + CONFIG.name + '. Built with data & curiosity.';
renderSocials(document.getElementById('footerSocials'));

/* =====================================================================
   4. INTERACTIONS / ANIMATIONS
   ===================================================================== */

// Scroll progress bar
const scrollProgress = document.getElementById('scroll-progress');
function updateScrollProgress(){
  const doc = document.documentElement;
  const scrollable = doc.scrollHeight - doc.clientHeight;
  const pct = scrollable > 0 ? (doc.scrollTop / scrollable) * 100 : 0;
  scrollProgress.style.width = pct + '%';
}
window.addEventListener('scroll', updateScrollProgress, { passive: true });
window.addEventListener('resize', updateScrollProgress);
updateScrollProgress();

// Mobile menu
const hamburger = document.getElementById('hamburger');
const mobileMenu = document.getElementById('mobileMenu');
const overlay = document.getElementById('overlay');
function closeMenu(){
  mobileMenu.classList.remove('open'); overlay.classList.remove('open');
  hamburger.setAttribute('aria-expanded', 'false');
}
hamburger.addEventListener('click', ()=>{
  const open = mobileMenu.classList.toggle('open');
  overlay.classList.toggle('open', open);
  hamburger.setAttribute('aria-expanded', String(open));
});
overlay.addEventListener('click', closeMenu);
mobileMenu.querySelectorAll('a').forEach(a=> a.addEventListener('click', closeMenu));

// Active nav link on scroll
const sections = document.querySelectorAll('main .cell');
const navA = document.querySelectorAll('.nav-links a');
const navObserver = new IntersectionObserver((entries)=>{
  entries.forEach(entry=>{
    if(entry.isIntersecting){
      const id = entry.target.getAttribute('id');
      navA.forEach(a=> a.classList.toggle('active', a.getAttribute('href') === '#'+id));
    }
  });
}, { rootMargin: '-45% 0px -50% 0px' });
sections.forEach(s=> navObserver.observe(s));

// Reveal-on-scroll for cells
const revealObserver = new IntersectionObserver((entries)=>{
  entries.forEach(entry=>{
    if(entry.isIntersecting){
      entry.target.classList.add('visible');
      revealObserver.unobserve(entry.target);
    }
  });
}, { threshold: 0.12 });
sections.forEach(s=> revealObserver.observe(s));
// hero visible immediately
document.getElementById('hero').classList.add('visible');
revealObserver.unobserve(document.getElementById('hero'));

// Typing effect for role line
const typedEl = document.getElementById('typedRole');
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if(reduceMotion){
  typedEl.textContent = CONFIG.typedRoles[0];
} else {
  let roleIdx = 0, charIdx = 0, deleting = false;
  function typeLoop(){
    const full = CONFIG.typedRoles[roleIdx];
    if(!deleting){
      charIdx++;
      typedEl.textContent = full.slice(0, charIdx);
      if(charIdx === full.length){ deleting = true; setTimeout(typeLoop, 1400); return; }
    } else {
      charIdx--;
      typedEl.textContent = full.slice(0, charIdx);
      if(charIdx === 0){ deleting = false; roleIdx = (roleIdx+1) % CONFIG.typedRoles.length; }
    }
    setTimeout(typeLoop, deleting ? 28 : 55);
  }
  typeLoop();
}

/* =====================================================================
   5. BACKGROUND CANVAS — animated scatter / data-point field
   ===================================================================== */
(function(){
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  let w, h, points = [];
  const COUNT = reduceMotion ? 0 : 60;

  function resize(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = Math.max(window.innerHeight, document.body.scrollHeight);
  }
  function init(){
    points = [];
    for(let i=0;i<COUNT;i++){
      points.push({
        x: Math.random()*w, y: Math.random()*h,
        vx: (Math.random()-0.5)*0.15, vy: (Math.random()-0.5)*0.15,
        r: Math.random()*1.6 + 0.6
      });
    }
  }
  function draw(){
    ctx.clearRect(0,0,w,h);
    ctx.strokeStyle = 'rgba(45,212,191,0.08)';
    ctx.lineWidth = 1;
    for(let i=0;i<points.length;i++){
      const p = points[i];
      p.x += p.vx; p.y += p.vy;
      if(p.x < 0 || p.x > w) p.vx *= -1;
      if(p.y < 0 || p.y > h) p.vy *= -1;
      for(let j=i+1;j<points.length;j++){
        const q = points[j];
        const d = Math.hypot(p.x-q.x, p.y-q.y);
        if(d < 130){
          ctx.globalAlpha = 1 - d/130;
          ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(q.x,q.y); ctx.stroke();
        }
      }
      ctx.globalAlpha = 1;
      ctx.fillStyle = 'rgba(242,183,5,0.5)';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
    }
    if(!reduceMotion) requestAnimationFrame(draw);
  }
  window.addEventListener('resize', ()=>{ resize(); init(); });
  resize(); init(); draw();
})();

// Mini sparkline-style canvas inside each project thumbnail
document.querySelectorAll('.project-thumb canvas').forEach(cv=>{
  const ctx = cv.getContext('2d');
  function size(){ cv.width = cv.parentElement.clientWidth; cv.height = cv.parentElement.clientHeight; }
  size();
  const pts = Array.from({length: 24}, ()=> Math.random());
  ctx.strokeStyle = 'rgba(45,212,191,0.35)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  pts.forEach((v,i)=>{
    const x = (i/(pts.length-1)) * cv.width;
    const y = cv.height - (v * cv.height * 0.7) - cv.height*0.15;
    i === 0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  });
  ctx.stroke();
});
</script>
